name: Build and Test

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # Build with Maven
      - name: Build with Maven
        run: mvn -B clean package --file calculator/pom.xml
        
      # Run tests
      - name: Run tests
        run: mvn -B test --file calculator/pom.xml
        
      # Upload build artifacts
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: calculator-jar
          path: calculator/target/*.jar
          retention-days: 7
          
      # Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: calculator/target/surefire-reports/
          retention-days: 7
