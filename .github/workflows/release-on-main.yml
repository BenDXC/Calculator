name: Release on Main Push

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      # Set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # Build with Maven
      - name: Build with Maven
        run: mvn -B clean package --file calculator/pom.xml
        
      # Run tests
      - name: Run tests
        run: mvn -B test --file calculator/pom.xml

      # Generate version based on timestamp
      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-build.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      # Get commit messages for changelog
      - name: Generate changelog
        id: changelog
        run: |
          echo "## Release ${{ steps.version.outputs.version }}" > changelog.md
          echo "" >> changelog.md
          echo "**Build Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> changelog.md
          echo "**Commit:** ${{ github.sha }}" >> changelog.md
          echo "" >> changelog.md
          echo "### Changes in this release" >> changelog.md
          echo "" >> changelog.md
          
          # Get last tag or use initial commit
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          
          if [ "$LAST_TAG" != "" ]; then
            echo "Changes since ${LAST_TAG}:" >> changelog.md
            echo "" >> changelog.md
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%an)" --no-merges >> changelog.md
          else
            echo "Initial release" >> changelog.md
            echo "" >> changelog.md
            git log --pretty=format:"- %s (%an)" --no-merges -10 >> changelog.md
          fi
          
          echo "" >> changelog.md
          echo "" >> changelog.md
          echo "### Test Results" >> changelog.md
          echo "- ✅ All tests passed" >> changelog.md
          echo "- 📦 JAR artifact included" >> changelog.md
          
          cat changelog.md

      # Create Git tag
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: false

      # Rename JAR with version
      - name: Prepare release artifacts
        run: |
          cp calculator/target/calculator-1.0.0.jar calculator-${{ steps.version.outputs.version_number }}.jar
          echo "Artifact created: calculator-${{ steps.version.outputs.version_number }}.jar"

      # Upload JAR to Release
      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./calculator-${{ steps.version.outputs.version_number }}.jar
          asset_name: calculator-${{ steps.version.outputs.version_number }}.jar
          asset_content_type: application/java-archive

      # Upload original JAR as well
      - name: Upload original JAR
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./calculator/target/calculator-1.0.0.jar
          asset_name: calculator-latest.jar
          asset_content_type: application/java-archive

      # Publish to GitHub Packages
      - name: Set up Maven settings for GitHub Packages
        run: |
          mkdir -p $HOME/.m2
          echo "<settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>\${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>" > $HOME/.m2/settings.xml

      - name: Publish to GitHub Packages
        run: mvn deploy -s $HOME/.m2/settings.xml --file calculator/pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Summary
      - name: Release Summary
        run: |
          echo "# Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 Release ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL:** ${{ steps.create_release.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- calculator-${{ steps.version.outputs.version_number }}.jar" >> $GITHUB_STEP_SUMMARY
          echo "- calculator-latest.jar" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Tests" >> $GITHUB_STEP_SUMMARY
          echo "All 225 tests passed successfully!" >> $GITHUB_STEP_SUMMARY
