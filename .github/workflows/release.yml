name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine tag name
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # Set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # Build with Maven
      - name: Build with Maven
        run: mvn -B clean package --file calculator/pom.xml

      # Run tests
      - name: Run tests
        run: mvn -B test --file calculator/pom.xml

      # Get version from tag
      - name: Get version
        id: version
        run: |
          VERSION=${{ steps.tag.outputs.tag }}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT

      # Generate changelog
      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --abbrev=0 --tags ${{ steps.tag.outputs.tag }}^ 2>/dev/null || echo "")
          
          # Create detailed CHANGELOG.md file
          echo "# CHANGELOG - Release ${{ steps.tag.outputs.tag }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Release Information" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- **Version:** ${{ steps.tag.outputs.tag }}" >> CHANGELOG.md
          echo "- **Release Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> CHANGELOG.md
          echo "- **Commit SHA:** ${{ github.sha }}" >> CHANGELOG.md
          echo "- **Branch:** ${{ github.ref_name }}" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes Since ${PREV_TAG}" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            
            # Group commits by type
            echo "### Features" >> CHANGELOG.md
            git log ${PREV_TAG}..${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%an, %h)" --no-merges --grep="^feat" >> CHANGELOG.md || echo "- No new features" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            
            echo "### Bug Fixes" >> CHANGELOG.md
            git log ${PREV_TAG}..${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%an, %h)" --no-merges --grep="^fix" >> CHANGELOG.md || echo "- No bug fixes" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            
            echo "### Documentation" >> CHANGELOG.md
            git log ${PREV_TAG}..${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%an, %h)" --no-merges --grep="^docs" >> CHANGELOG.md || echo "- No documentation changes" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            
            echo "### Other Changes" >> CHANGELOG.md
            git log ${PREV_TAG}..${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%an, %h)" --no-merges --invert-grep --grep="^feat\|^fix\|^docs" >> CHANGELOG.md || echo "- No other changes" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            
            echo "### Full Commit History" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log ${PREV_TAG}..${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%an, %h)" --no-merges >> CHANGELOG.md
          else
            echo "## Initial Release" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "This is the first release of the Calculator application." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "### Recent Commits" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s (%an, %h)" --no-merges -10 >> CHANGELOG.md
          fi
          
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Test Results" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- ✅ **Tests Passed:** 225/225 (100%)" >> CHANGELOG.md
          echo "- ✅ **Build Status:** SUCCESS" >> CHANGELOG.md
          echo "- ✅ **JAR Created:** calculator-${{ steps.version.outputs.version }}.jar" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Artifacts" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "This release includes the following artifacts:" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "1. **calculator-${{ steps.version.outputs.version }}.jar** - Calculator application" >> CHANGELOG.md
          echo "2. **CHANGELOG.md** - This changelog file" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## How to Use" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Download the JAR file and run:" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "java -jar calculator-${{ steps.version.outputs.version }}.jar" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Generated by GitHub Actions**" >> CHANGELOG.md
          echo "**Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> CHANGELOG.md
          
          # Create shorter release notes
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > release-notes.md
            echo "" >> release-notes.md
            git log ${PREV_TAG}..${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%h)" >> release-notes.md
          else
            echo "## Initial Release" > release-notes.md
            echo "" >> release-notes.md
            echo "First release of Calculator application" >> release-notes.md
          fi
          
          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Test Results" >> release-notes.md
          echo "- ✅ All 225 tests passed" >> release-notes.md
          echo "- 📦 JAR artifact included" >> release-notes.md
          echo "- 📄 Full CHANGELOG.md available in release assets" >> release-notes.md
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: Release ${{ steps.tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}

      # Upload CHANGELOG.md to Release
      - name: Upload CHANGELOG to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./CHANGELOG.md
          asset_name: CHANGELOG.md
          asset_content_type: text/markdown

      # Find and upload JAR file
      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./calculator/target/calculator-1.0.0.jar
          asset_name: calculator-${{ steps.version.outputs.version }}.jar
          asset_content_type: application/java-archive

      # Optional: Publish to GitHub Packages
      - name: Set up Maven settings for GitHub Packages
        run: |
          mkdir -p $HOME/.m2
          echo "<settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>\${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>" > $HOME/.m2/settings.xml

      - name: Publish to GitHub Packages
        run: mvn deploy -s $HOME/.m2/settings.xml --file calculator/pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Don't fail if package deployment has issues

      # Output release information
      - name: Release created successfully
        run: |
          echo "✅ Release ${{ steps.tag.outputs.tag }} has been created"
          echo "Release URL: ${{ steps.create_release.outputs.html_url }}"
