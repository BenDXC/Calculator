name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine tag name
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # Set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # Build with Maven
      - name: Build with Maven
        run: mvn -B clean package --file calculator/pom.xml

      # Run tests
      - name: Run tests
        run: mvn -B test --file calculator/pom.xml

      # Get version from tag
      - name: Get version
        id: version
        run: |
          VERSION=${{ steps.tag.outputs.tag }}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT

      # Generate changelog
      - name: Generate changelog
        id: changelog
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Get previous tag
            PREV_TAG=$(git describe --abbrev=0 --tags ${{ steps.tag.outputs.tag }}^ 2>/dev/null || echo "")
            
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since ${PREV_TAG}" > changelog.md
              echo "" >> changelog.md
              git log ${PREV_TAG}..${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%h)" >> changelog.md
            else
              echo "## Initial Release" > changelog.md
              echo "" >> changelog.md
              echo "First release of Calculator application" >> changelog.md
            fi
          else
            echo "## Release ${{ steps.tag.outputs.tag }}" > changelog.md
            echo "" >> changelog.md
            echo "Manual release triggered" >> changelog.md
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: Release ${{ steps.tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}

      # Find and upload JAR file
      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./calculator/target/junit-platform-console-standalone-1.7.0-M1.jar
          asset_name: calculator-${{ steps.version.outputs.version }}.jar
          asset_content_type: application/java-archive

      # Optional: Publish to GitHub Packages
      - name: Set up Maven settings for GitHub Packages
        run: |
          mkdir -p $HOME/.m2
          echo "<settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>\${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>" > $HOME/.m2/settings.xml

      - name: Publish to GitHub Packages
        run: mvn deploy -s $HOME/.m2/settings.xml --file calculator/pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Don't fail if package deployment has issues

      # Output release information
      - name: Release created successfully
        run: |
          echo "✅ Release ${{ steps.tag.outputs.tag }} has been created"
          echo "Release URL: ${{ steps.create_release.outputs.html_url }}"
